name: Tests

on:
  pull_request:
  push:
    branches: [main]

# The workflow only ever reads the checkout, so the token gets nothing else.
# A fork's pull request already runs with a read-only token, but stating it
# here means a future job cannot silently inherit write access.
permissions:
  contents: read

# A new push supersedes any run still in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to a commit SHA rather than a tag: a tag can be
      # moved to point at different code, a SHA cannot. Dependabot opens the
      # pull requests that move these forward.
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this job talks to GitHub, so the token has no reason to
          # stay behind in .git/config where later steps could reach it.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The browser comes from the cache-aware steps below. Without this,
          # the package's postinstall hook downloads it first and the cache
          # never gets a chance to be used.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Key the browser cache to the resolved Playwright version, so bumping
      # the dependency fetches a matching build instead of reusing a stale one.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser cache
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system libraries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser itself is cached, but the apt packages it links against
      # are not part of the runner image, so they are installed either way.
      - name: Install system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the test suite
        run: npm test

      # Only on a red run: the trace replays the failing moment action by
      # action, so a CI failure can be diagnosed without reproducing it.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
