server {
    listen      80;
    server_name localhost;
    root        /usr/share/nginx/html;

    # Docker Desktop serves bind-mounted files through a filesystem share.
    # nginx's sendfile path can hand back stale content after an edit there,
    # so it is turned off: the files are tiny and the copy cost is invisible.
    sendfile off;

    # Meeter is a local tool, so correctness beats caching. Without this a
    # browser will happily keep serving the version of app.js it already has,
    # and an edit looks like it did nothing.
    add_header Cache-Control "no-store" always;
    etag off;

    # The same policy as the meta tag in index.html, plus frame-ancestors,
    # which browsers only honour when it arrives as a header. Serving it both
    # ways means the page is covered whether it is opened through this
    # container or straight off the filesystem.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Stop a mistyped Content-Type from being reinterpreted as something
    # executable, keep the URL out of the Referer sent to Google Fonts, and
    # decline the device APIs the app has no use for.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    location / {
        index     index.html;
        try_files $uri $uri/ =404;
    }
}
